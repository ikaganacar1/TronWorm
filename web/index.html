<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Tron Worm - Multiplayer Snake Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Connection Screen -->
        <div id="connection-screen" class="screen active">
            <div class="container">
                <h1 class="title">🐍 TRON WORM</h1>
                <p class="subtitle">Multiplayer Snake Battle</p>

                <div class="form-group">
                    <label for="player-name">Your Name:</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="server-url">Server URL:</label>
                    <input type="text" id="server-url" placeholder="ws://localhost:8765" value="ws://localhost:8765">
                </div>

                <button id="connect-btn" class="btn btn-primary">Connect</button>

                <div id="connection-status" class="status-message"></div>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <div class="container">
                <h1 class="title">🐍 TRON WORM</h1>
                <p class="subtitle">Multiplayer Snake Battle</p>

                <div class="lobby-section">
                    <h2>Players (<span id="player-count">0</span>/5)</h2>
                    <div id="player-list" class="player-list"></div>
                </div>

                <div class="lobby-actions">
                    <button id="ready-btn" class="btn btn-success">Ready Up</button>
                    <button id="solo-btn" class="btn btn-primary" style="display: none;">Start Solo Practice</button>
                    <button id="disconnect-btn" class="btn btn-danger">Disconnect</button>
                </div>

                <div class="instructions">
                    <h3>Controls:</h3>
                    <p>🎮 Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move</p>
                    <p>⚠️ Avoid walls and trails</p>
                    <p>🏆 Last player alive wins!</p>
                </div>
            </div>
        </div>

        <!-- Countdown Screen -->
        <div id="countdown-screen" class="screen">
            <div class="countdown-container">
                <div id="countdown-number" class="countdown-number">3</div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <div class="game-header">
                    <div class="game-info">
                        <span>Round: <strong id="round-number">1</strong></span>
                        <span>Speed: <strong id="game-speed">10.0</strong></span>
                    </div>
                    <div id="scores-display" class="scores"></div>
                </div>
                <canvas id="game-canvas"></canvas>
                <div class="game-footer">
                    <p>🎮 Arrow Keys / WASD to move • Press ESC to disconnect</p>
                </div>
            </div>
        </div>

        <!-- Round End Screen -->
        <div id="round-end-screen" class="screen">
            <div class="container">
                <h1 id="winner-text" class="winner-text">🏆 Winner! 🏆</h1>

                <div class="scores-section">
                    <h2>Scores</h2>
                    <div id="final-scores" class="final-scores"></div>
                </div>

                <div class="round-end-actions">
                    <button id="next-round-btn" class="btn btn-success">Ready for Next Round</button>
                    <button id="quit-btn" class="btn btn-danger">Quit Game</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
