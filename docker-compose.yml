version: '3.8'

services:
  tronworm:
    build:
      context: .
      dockerfile: Dockerfile
    image: tronworm:latest
    container_name: tronworm-game
    ports:
      - "8080:8080"  # HTTP server
      - "8765:8765"  # WebSocket server
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - tronworm-net

networks:
  tronworm-net:
    driver: bridge
